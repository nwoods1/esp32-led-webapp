<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>MPU6050 Monitor</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 25px;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 10px;
    }

    #status {
      font-weight: bold;
      margin: 15px;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      margin: 15px;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    .section {
      background: white;
      padding: 20px;
      margin-top: 20px;
      border-radius: 12px;
    }

    .value {
      font-size: 24px;
      margin: 12px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>MPU6050 Live Data</h1>

    <p id="status">
      Not connected
    </p>

    <button id="connect">
      Connect to ESP32
    </button>

    <div class="section">

      <h2>Acceleration</h2>

      <div class="value">
        X: <span id="ax">0.000</span> g
      </div>

      <div class="value">
        Y: <span id="ay">0.000</span> g
      </div>

      <div class="value">
        Z: <span id="az">0.000</span> g
      </div>

    </div>

    <div class="section">

      <h2>Relative Angle</h2>

      <div class="value">
        X: <span id="angleX">0.00</span>°
      </div>

      <div class="value">
        Y: <span id="angleY">0.00</span>°
      </div>

      <div class="value">
        Z: <span id="angleZ">0.00</span>°
      </div>

    </div>

  </div>

  <script>

    const SERVICE_UUID =
      "12345678-1234-1234-1234-1234567890ab";

    const CHARACTERISTIC_UUID =
      "abcdefab-1234-5678-1234-abcdefabcdef";

    const statusText =
      document.getElementById("status");

    document
      .getElementById("connect")
      .addEventListener("click", connectToESP32);


    async function connectToESP32() {

      try {

        statusText.textContent = "Searching...";

        const device =
          await navigator.bluetooth.requestDevice({
            filters: [
              {
                name: "MPU6050"
              }
            ],
            optionalServices: [
              SERVICE_UUID
            ]
          });

        statusText.textContent = "Connecting...";

        const server =
          await device.gatt.connect();

        const service =
          await server.getPrimaryService(
            SERVICE_UUID
          );

        const characteristic =
          await service.getCharacteristic(
            CHARACTERISTIC_UUID
          );

        // Start receiving notifications
        await characteristic.startNotifications();

        characteristic.addEventListener(
          "characteristicvaluechanged",
          handleSensorData
        );

        statusText.textContent =
          "Connected to MPU6050";

      }

      catch (error) {

        console.error(error);

        statusText.textContent =
          "Connection failed: " + error.message;

      }

    }


    function handleSensorData(event) {

      const data = event.target.value;

      /*
        ESP32 sends 6 signed 16-bit integers:

        0: acceleration X × 1000
        1: acceleration Y × 1000
        2: acceleration Z × 1000

        3: angle X × 100
        4: angle Y × 100
        5: angle Z × 100
      */

      const ax =
        data.getInt16(0, true) / 1000;

      const ay =
        data.getInt16(2, true) / 1000;

      const az =
        data.getInt16(4, true) / 1000;

      const angleX =
        data.getInt16(6, true) / 100;

      const angleY =
        data.getInt16(8, true) / 100;

      const angleZ =
        data.getInt16(10, true) / 100;


      document.getElementById("ax").textContent =
        ax.toFixed(3);

      document.getElementById("ay").textContent =
        ay.toFixed(3);

      document.getElementById("az").textContent =
        az.toFixed(3);


      document.getElementById("angleX").textContent =
        angleX.toFixed(2);

      document.getElementById("angleY").textContent =
        angleY.toFixed(2);

      document.getElementById("angleZ").textContent =
        angleZ.toFixed(2);

    }

  </script>

</body>

</html>
