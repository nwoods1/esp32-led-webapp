<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Gyro Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
      padding: 30px;
    }

    h1 {
      margin-bottom: 10px;
    }

    #status {
      font-weight: bold;
      margin-bottom: 20px;
    }

    button {
      padding: 14px 24px;
      font-size: 18px;
      cursor: pointer;
      margin-bottom: 25px;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    .section {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
    }

    .value {
      font-size: 22px;
      margin: 10px 0;
    }

    canvas {
      width: 100%;
      max-width: 520px;
      height: 240px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>MPU6050 Live Data</h1>

    <p id="status">Not connected</p>

    <button id="connect">
      Connect to ESP32
    </button>

    <div class="section">
      <h2>Acceleration</h2>

      <div class="value">
        X: <span id="ax">0.000</span> g
      </div>

      <div class="value">
        Y: <span id="ay">0.000</span> g
      </div>

      <div class="value">
        Z: <span id="az">0.000</span> g
      </div>
    </div>

    <div class="section">
      <h2>Relative Angle</h2>

      <div class="value">
        X: <span id="angleX">0.00</span>°
      </div>

      <div class="value">
        Y: <span id="angleY">0.00</span>°
      </div>

      <div class="value">
        Z: <span id="angleZ">0.00</span>°
      </div>
    </div>

    <div class="section">
      <h2>Step Impact</h2>

      <canvas
        id="impactChart"
        width="520"
        height="240"
      ></canvas>

      <div class="value">
        Current impact:
        <span id="impact">0.00</span> g
      </div>
    </div>

  </div>


  <script>

    const SERVICE_UUID =
      "12345678-1234-1234-1234-1234567890ab";

    const CHARACTERISTIC_UUID =
      "abcdefab-1234-5678-1234-abcdefabcdef";


    const statusText =
      document.getElementById("status");

    const connectButton =
      document.getElementById("connect");


    const canvas =
      document.getElementById("impactChart");

    const ctx =
      canvas.getContext("2d");


    const impactData = [];

    const MAX_POINTS = 100;

    const MAX_G = 3;


    connectButton.addEventListener(
      "click",
      connectToESP32
    );


    async function connectToESP32() {

      try {

        statusText.textContent =
          "Searching for Bluetooth devices...";


        const device =
          await navigator.bluetooth.requestDevice({

            acceptAllDevices: true,

            optionalServices: [
              SERVICE_UUID
            ]

          });


        const deviceName =
          device.name || "Unknown device";


        statusText.textContent =
          "Connecting to " + deviceName + "...";


        const server =
          await device.gatt.connect();


        const service =
          await server.getPrimaryService(
            SERVICE_UUID
          );


        const characteristic =
          await service.getCharacteristic(
            CHARACTERISTIC_UUID
          );


        await characteristic.startNotifications();


        characteristic.addEventListener(
          "characteristicvaluechanged",
          handleSensorData
        );


        statusText.textContent =
          "Connected to " + deviceName;

      }

      catch (error) {

        console.error(error);

        statusText.textContent =
          "Connection failed: " +
          error.message;

      }

    }


    function handleSensorData(event) {

      const data =
        event.target.value;


      if (data.byteLength < 12) {

        console.log(
          "Unexpected packet length:",
          data.byteLength
        );

        return;

      }


      // -----------------------
      // Read acceleration
      // -----------------------

      const ax =
        data.getInt16(0, true) / 1000.0;

      const ay =
        data.getInt16(2, true) / 1000.0;

      const az =
        data.getInt16(4, true) / 1000.0;


      // -----------------------
      // Read angles
      // -----------------------

      const angleX =
        data.getInt16(6, true) / 100.0;

      const angleY =
        data.getInt16(8, true) / 100.0;

      const angleZ =
        data.getInt16(10, true) / 100.0;


      // -----------------------
      // Update displayed values
      // -----------------------

      document.getElementById("ax").textContent =
        ax.toFixed(3);

      document.getElementById("ay").textContent =
        ay.toFixed(3);

      document.getElementById("az").textContent =
        az.toFixed(3);


      document.getElementById("angleX").textContent =
        angleX.toFixed(2);

      document.getElementById("angleY").textContent =
        angleY.toFixed(2);

      document.getElementById("angleZ").textContent =
        angleZ.toFixed(2);


      // -----------------------
      // Calculate step impact
      // -----------------------

      const accelerationMagnitude =
        Math.sqrt(
          ax * ax +
          ay * ay +
          az * az
        );


      // Remove Earth's constant 1g gravity
      const impact =
        Math.abs(
          accelerationMagnitude - 1.0
        );


      document.getElementById("impact").textContent =
        impact.toFixed(2);


      // Add new graph value
      impactData.push(
        impact
      );


      // Only keep most recent values
      if (
        impactData.length >
        MAX_POINTS
      ) {

        impactData.shift();

      }


      drawImpactGraph();

    }


    function drawImpactGraph() {

      const width =
        canvas.width;

      const height =
        canvas.height;


      const leftPadding = 45;
      const rightPadding = 15;
      const topPadding = 15;
      const bottomPadding = 30;


      const graphWidth =
        width -
        leftPadding -
        rightPadding;

      const graphHeight =
        height -
        topPadding -
        bottomPadding;


      // Clear graph
      ctx.clearRect(
        0,
        0,
        width,
        height
      );


      // White background
      ctx.fillStyle =
        "#ffffff";

      ctx.fillRect(
        0,
        0,
        width,
        height
      );


      // -----------------------
      // Grid
      // -----------------------

      ctx.strokeStyle =
        "#dddddd";

      ctx.lineWidth = 1;

      ctx.font =
        "12px Arial";

      ctx.fillStyle =
        "#555555";


      for (
        let g = 0;
        g <= MAX_G;
        g += 0.5
      ) {

        const y =
          topPadding +
          graphHeight -
          (g / MAX_G) *
          graphHeight;


        ctx.beginPath();

        ctx.moveTo(
          leftPadding,
          y
        );

        ctx.lineTo(
          width - rightPadding,
          y
        );

        ctx.stroke();


        ctx.fillText(
          g.toFixed(1) + "g",
          5,
          y + 4
        );

      }


      // -----------------------
      // X axis label
      // -----------------------

      ctx.fillStyle =
        "#555555";

      ctx.font =
        "12px Arial";

      ctx.fillText(
        "Older",
        leftPadding,
        height - 8
      );

      ctx.fillText(
        "Now",
        width - 40,
        height - 8
      );


      // -----------------------
      // Draw impact line
      // -----------------------

      if (
        impactData.length < 2
      ) {
        return;
      }


      ctx.beginPath();

      ctx.strokeStyle =
        "#2563eb";

      ctx.lineWidth = 3;


      impactData.forEach(
        (value, index) => {

          const x =
            leftPadding +
            (index /
              (MAX_POINTS - 1)) *
            graphWidth;


          const clampedValue =
            Math.min(
              value,
              MAX_G
            );


          const y =
            topPadding +
            graphHeight -
            (clampedValue /
              MAX_G) *
            graphHeight;


          if (
            index === 0
          ) {

            ctx.moveTo(
              x,
              y
            );

          }

          else {

            ctx.lineTo(
              x,
              y
            );

          }

        }
      );


      ctx.stroke();

    }


    // Draw empty graph immediately
    drawImpactGraph();

  </script>

</body>
</html>
